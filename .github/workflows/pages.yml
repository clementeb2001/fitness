name: Deploy to GitHub Pages

# Deployt die statische PWA bei jedem Push auf main nach GitHub Pages.
# Pages source must be GitHub Actions; branch deployments bypass the hashed build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked native build dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify native web bundle
        run: pnpm run web:build
      - name: Verify training logic and preview coverage
        run: node --test tests/*.test.cjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static app
        run: node scripts/web-build.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
